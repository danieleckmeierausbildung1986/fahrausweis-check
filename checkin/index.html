
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schulungs-Check-in</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1b2a;
      color: #e8edf2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #162032;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #7a94b0;
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7a94b0;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: #0d1b2a;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 16px;
      color: #e8edf2;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }

    input:focus {
      border-color: #c9a84c;
    }

    input::placeholder {
      color: #3a5572;
    }

    button {
      width: 100%;
      background: #c9a84c;
      border: none;
      border-radius: 8px;
      padding: 15px;
      font-size: 15px;
      font-weight: 700;
      color: #0d1b2a;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover:not(:disabled) { background: #dbb95a; }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { background: #3a5572; color: #7a94b0; cursor: not-allowed; }

    .kurs-choice {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 8px;
    }

    .kurs-choice.visible { display: flex; }

    .kurs-btn {
      width: 100%;
      background: #0d1b2a;
      border: 1.5px solid #1e3a5f;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #e8edf2;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s, background 0.2s;
    }

    .kurs-btn:hover:not(:disabled) { border-color: #c9a84c; background: #1a2a40; }
    .kurs-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .choice-label {
      font-size: 13px;
      color: #7a94b0;
      margin-bottom: 14px;
    }

    .status {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      display: none;
      line-height: 1.5;
    }

    .status.success {
      background: #0a2e1a;
      border: 1px solid #1a6b3a;
      color: #4cd98a;
      display: block;
    }

    .status.error {
      background: #2e0a0a;
      border: 1px solid #6b1a1a;
      color: #d94c4c;
      display: block;
    }

    .status.loading {
      background: #0d1b2a;
      border: 1px solid #1e3a5f;
      color: #7a94b0;
      display: block;
    }

    .name-display {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 4px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #3a5572;
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .again-btn {
      margin-top: 14px;
      background: transparent;
      border: 1.5px solid #1e3a5f;
      color: #7a94b0;
    }
    .again-btn:hover:not(:disabled) { border-color: #c9a84c; color: #c9a84c; background: transparent; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">DGUV 308-001 · Ausbildung</div>
    <h1>Schulungs-Check-in</h1>
    <p class="subtitle" id="subtitle">Bitte Registrierungsnummer eingeben zur Anwesenheitserfassung.</p>

    <div id="step-regnr">
      <label for="regnr">Registrierungsnummer</label>
      <input
        type="text"
        id="regnr"
        placeholder="z. B. 2026-001"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      />
      <button id="btnWeiter" onclick="sucheTeilnehmer()">Weiter</button>
    </div>

    <div id="step-kurswahl">
      <p class="choice-label">Für welche Schulung einchecken?</p>
      <div class="kurs-choice visible" id="kursChoice"></div>
    </div>

    <div class="status" id="status"></div>

    <button class="again-btn" id="btnNochmal" style="display:none" onclick="reset()">Nächster Teilnehmer</button>
  </div>

  <script>
    const FLOW_URL = "https://default8af25f9034bc4ef4aba22ab6f641d5.01.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/700a9a9011d74232b5e0ca42997723aa/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=EWlMM-zKm8M48s9AYQK0JMP6mcrWDE9QhbG4WYaLCRM";

    var aktuelleRegnr = '';

    function zeigeSchritt(name) {
      document.getElementById('step-regnr').style.display = name === 'regnr' ? 'block' : 'none';
      document.getElementById('step-kurswahl').style.display = name === 'kurswahl' ? 'block' : 'none';
      document.getElementById('btnNochmal').style.display = name === 'fertig' ? 'block' : 'none';
    }

    async function sucheTeilnehmer() {
      const regnr = document.getElementById('regnr').value.trim();
      const btn = document.getElementById('btnWeiter');

      if (!regnr) {
        showStatus('error', 'Bitte Registrierungsnummer eingeben.');
        return;
      }

      aktuelleRegnr = regnr;
      btn.disabled = true;
      showStatus('loading', '<span class="spinner"></span>Suche Teilnehmer…');

      try {
        const response = await fetch(FLOW_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ registrierungsnummer: regnr })
        });
        const data = await response.json();

        if (!response.ok || !data.success) {
          if (data.error === 'not_found') {
            showStatus('error', 'Registrierungsnummer nicht gefunden. Bitte prüfen.');
          } else if (data.error === 'no_courses') {
            showStatus('error', 'Für diese Registrierungsnummer sind keine Kurse gebucht.');
          } else {
            showStatus('error', 'Fehler beim Suchen. Bitte erneut versuchen.');
          }
          btn.disabled = false;
          return;
        }

        var kurse = data.kurse || [];
        if (kurse.length === 0) {
          showStatus('error', 'Für diese Registrierungsnummer sind keine Kurse gebucht.');
          btn.disabled = false;
          return;
        }

        if (kurse.length === 1) {
          checkeEin(kurse[0].typ, data.vorname, data.name);
          return;
        }

        // Mehrere Kurse gebucht -> Auswahl anzeigen
        showStatus('', '');
        document.getElementById('status').style.display = 'none';
        document.getElementById('subtitle').textContent = data.vorname + ' ' + data.name + ' — bitte Schulung auswählen.';
        var choiceEl = document.getElementById('kursChoice');
        choiceEl.innerHTML = '';
        kurse.forEach(function(k) {
          var kb = document.createElement('button');
          kb.className = 'kurs-btn';
          kb.textContent = k.label;
          kb.onclick = function() { checkeEin(k.typ, data.vorname, data.name); };
          choiceEl.appendChild(kb);
        });
        zeigeSchritt('kurswahl');
        btn.disabled = false;
      } catch (e) {
        showStatus('error', 'Verbindungsfehler. Bitte erneut versuchen.');
        btn.disabled = false;
      }
    }

    async function checkeEin(typ, vornameVorab, nameVorab) {
      document.querySelectorAll('.kurs-btn').forEach(function(b) { b.disabled = true; });
      showStatus('loading', '<span class="spinner"></span>Wird erfasst…');

      try {
        const response = await fetch(FLOW_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ registrierungsnummer: aktuelleRegnr, typ: typ })
        });
        const data = await response.json();

        if (response.ok && data.success) {
          showStatus('success',
            `✓ Anwesenheit erfasst<br>
            <span class="name-display">${data.vorname || vornameVorab} ${data.name || nameVorab}</span>
            <br>Schulung: ${data.schulungstyp || typ}`
          );
          zeigeSchritt('fertig');
        } else {
          showStatus('error', 'Fehler beim Check-in. Bitte erneut versuchen.');
          document.querySelectorAll('.kurs-btn').forEach(function(b) { b.disabled = false; });
        }
      } catch (e) {
        showStatus('error', 'Verbindungsfehler. Bitte erneut versuchen.');
        document.querySelectorAll('.kurs-btn').forEach(function(b) { b.disabled = false; });
      }
    }

    function showStatus(type, message) {
      const status = document.getElementById('status');
      if (!type) { status.style.display = 'none'; return; }
      status.className = 'status ' + type;
      status.innerHTML = message;
    }

    function reset() {
      aktuelleRegnr = '';
      document.getElementById('regnr').value = '';
      document.getElementById('subtitle').textContent = 'Bitte Registrierungsnummer eingeben zur Anwesenheitserfassung.';
      document.getElementById('btnWeiter').disabled = false;
      showStatus('', '');
      zeigeSchritt('regnr');
    }

    document.getElementById('regnr').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') sucheTeilnehmer();
    });

    zeigeSchritt('regnr');
  </script>
</body>
</html>
